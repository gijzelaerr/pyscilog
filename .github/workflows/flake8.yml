name: Flake8
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-ubuntu-3.11-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with test

      - name: Ensure flake8 is available
        run: poetry run pip install flake8

      - name: Lint with flake8
        run: |
          poetry run flake8 --count --select=E9,F63,F7,F82 --show-source --statistics pyscilog test
          poetry run flake8 --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics pyscilog test